services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./LOG/nginx:/var/log/nginx
    depends_on:
      - php
    networks:
      - service-network

  php:
    build: .
    volumes:
      - ./www:/var/www/html
      # 项目根目录挂载，供目录结构自检使用（www / data / LOG）
      - ./:/panel
    networks:
      - service-network
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=service_panel
      - DB_USER=user
      - DB_PASSWORD=userpassword
      # 自检根目录：www / data / LOG 均在其下
      - PANEL_ROOT=/panel
      # 约束：数据库文件必须放在 data 下，日志只能写进 LOG
      - DB_DATA_PATH=/panel/data
      - LOG_PATH=/panel/LOG/app.log

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: service_panel
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - ./data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - service-network

networks:
  service-network:
    driver: bridge
